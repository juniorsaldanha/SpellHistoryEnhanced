name: Package and Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CurseForge and Wago both publish from GitHub on their own:
      #   - CurseForge: "Automatic Packaging" watches the linked repo for tags.
      #   - Wago: a GitHub webhook on the "Releases" event.
      # So this Action only builds the zip and creates the GitHub release (which
      # in turn fires the Wago webhook). No CF/Wago tokens are passed here, to
      # avoid double uploads.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
