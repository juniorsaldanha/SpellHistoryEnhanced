name: Package and Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CurseForge is published by its own "Automatic Packaging" (it watches the
      # linked GitHub repo for tags), so CF_API_KEY is intentionally NOT passed
      # here to avoid double-uploading. This Action handles Wago + the GitHub
      # release only.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
